services:
  - type: web
    name: hs300-dual-model-web
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PREDICTION_DB
        value: /var/data/predictions.sqlite3
